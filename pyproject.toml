[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moltop"
version = "0.1.0"
description = "Molecular graph topology and numerical spatial linking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos = "researchos.__main__:main"
moltop = "moltop.__main__:main"

[tool.setuptools.packages.find]
include = ["moltop*", "researchos*"]

[tool.setuptools.package-data]
researchos = ["*.json"]
